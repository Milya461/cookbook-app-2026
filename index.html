function escapeHtml(value) {
  const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  return String(value == null ? "" : value).replace(/[&<>"']/g, character => entities[character]);
}

function compressRecipeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Не получилось прочитать изображение."));
    reader.onload = () => {
      const image = new Image();
      image.onerror = () => reject(new Error("Файл не удалось открыть как изображение."));
      image.onload = () => {
        const maxSide = 900;
        const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
        try {
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        } catch (error) {
          reject(error);
        }
      };
      image.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function saveCustomRecipe(event) {
  event.preventDefault();

  const title = document.getElementById("newRecipeTitle").value.trim();
  const category = document.getElementById("newRecipeCategory").value.trim();
  const description = document.getElementById("newRecipeDescription").value.trim();
  const ingredients = document.getElementById("newRecipeIngredients").value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
  const steps = document.getElementById("newRecipeSteps").value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
  const file = document.getElementById("newRecipeImageFile").files[0];
  let image = document.getElementById("newRecipeImageUrl").value.trim();

  if (!title || !category) {
    alert("Заполни название и категорию рецепта.");
    return;
  }

  if (Object.values(recipes).flat().some(recipe => recipe[0].toLowerCase() === title.toLowerCase())) {
    alert("Рецепт с таким названием уже есть. Укажи другое название.");
    return;
  }

  if (file) {
    try {
      image = await compressRecipeImage(file);
    } catch (error) {
      alert(error.message || "Не удалось обработать фотографию.");
      return;
    }
  }

  const recipe = {
    title,
    category,
    description: description || "Мой домашний рецепт",
    ingredients,
    steps,
    image
  };

  const updatedRecipes = userAddedRecipes.concat(recipe);

  try {
    localStorage.setItem(CUSTOM_RECIPES_KEY, JSON.stringify(updatedRecipes));
  } catch (error) {
    alert("Не удалось сохранить рецепт. Возможно, в памяти браузера закончилось место. Попробуй фото меньшего размера или добавь ссылку на фото.");
    return;
  }

  userAddedRecipes = updatedRecipes;
  if (!recipes[category]) recipes[category] = [];
  recipes[category].push([recipe.title, recipe.description]);
  if (image) recipeImages[recipe.title] = image;

  showCategory(category);
}

    page: "category",
    category: category

  showRecipe(category, index);

}


/* РЕЦЕПТ */

function showRecipe(category, index) {

  const recipe = recipes[category][index];

  const name = recipe[0];

  const isSelected =
    selected.includes(name);


  const fileName = recipeImages[name] || "";
  const customRecipe = userAddedRecipes.find(item => item.title === name && item.category === category);
  const imageUrl = !fileName
    ? ""
    : (/^(https?:|data:image\/)/i.test(fileName)
      ? fileName
      : "https://raw.githubusercontent.com/Milya461/cookbook-app-2026/main/" + encodeURIComponent(fileName));

  const ingredients = customRecipe
    ? customRecipe.ingredients
    : ["Основные продукты", "Овощи и зелень", "Специи по вкусу"];
  const steps = customRecipe
    ? customRecipe.steps
    : [
        "Подготовить необходимые ингредиенты.",
        "Приготовить основные продукты.",
        "Соединить ингредиенты.",
        "Подать готовое блюдо."
      ];
  const photoHtml = imageUrl
    ? '<img src="' + escapeHtml(imageUrl) + '" alt="' + escapeHtml(name) + '">'
    : '<div class="recipe-photo-placeholder">🍲</div>';
  const ingredientsHtml = ingredients && ingredients.length
    ? '<ul>' + ingredients.map(item => '<li>' + escapeHtml(item) + '</li>').join("") + '</ul>'
    : '<p class="form-note">Ингредиенты пока не добавлены.</p>';
  const stepsHtml = steps && steps.length
    ? '<ol>' + steps.map(item => '<li>' + escapeHtml(item) + '</li>').join("") + '</ol>'
    : '<p class="form-note">Способ приготовления пока не добавлен.</p>';


  document.getElementById("app").innerHTML = `

    <section class="screen">

      <div class="header">

        <button
          class="back"
          onclick="goBack()"
        >
          Назад
        </button>

      </div>

      <article class="recipe">

        <div class="recipe-photo">

          ${photoHtml}

        </div>

        <div class="recipe-content">

          <h1>
            ${escapeHtml(name)}
          </h1>

          <p>
            ${escapeHtml(recipe[1])}
          </p>

          <h2>
            Ингредиенты
          </h2>

          ${ingredientsHtml}

          <h2>
            Приготовление
          </h2>

          ${stepsHtml}

          <button
            class="button favorite"
            onclick="toggleSelected(
              '${escapeQuotes(name)}'
            )"
          >

            ${
              isSelected
                ? "Убрать из моего выбора"
                : "Добавить в мой выбор"
            }

          </button>

        </div>

      </article>

    </section>

  `;

}


/* ДОБАВИТЬ / УДАЛИТЬ ИЗ МОЕГО ВЫБОРА */

function toggleSelected(name) {

  if (selected.includes(name)) {

    selected =
      selected.filter(
        item => item !== name
      );

  } else {

    selected.push(name);

  }

  saveSelected();

  showMenu();

}


/* ОТКРЫТЬ МОЙ ВЫБОР */

function openSelected() {

  history.push({
    page: "menu"
  });

  showSelected();

}


/* МОЙ ВЫБОР */

function showSelected() {

  if (selected.length === 0) {

    document.getElementById("app").innerHTML = `

      <section class="screen">

        <div class="header">

          <h1>
            Мой выбор
          </h1>

          <button
            class="back"
            onclick="goBack()"
          >
            Назад
          </button>

        </div>

        <div class="empty">

          <p>
            Пока ничего не выбрано
          </p>

          <button
            class="button"
            onclick="goBack()"
          >
            Выбрать блюда
          </button>

        </div>

      </section>

    `;

    return;

  }


  document.getElementById("app").innerHTML = `

    <section class="screen">

      <div class="header">

        <h1>
          Мой выбор
        </h1>

        <button
          class="back"
          onclick="goBack()"
        >
          Назад
        </button>

      </div>

      <div class="selected-list">

        ${selected.map(name => `

          <div class="selected-item">

            <span>
              ${name}
            </span>

            <button
              class="remove"
              onclick="removeSelected(
                '${escapeQuotes(name)}'
              )"
            >
              Удалить
            </button>

          </div>

        `).join("")}

      </div>

      <button
        class="button"
        style="width:100%"
        onclick="sendSelection()"
      >
        Отправить мой выбор
      </button>

    </section>

  `;

}


/* УДАЛИТЬ ИЗ МОЕГО ВЫБОРА */

function removeSelected(name) {

  selected =
    selected.filter(
      item => item !== name
    );

  saveSelected();

  showSelected();

}


/* ОТПРАВИТЬ В TELEGRAM */

async function sendSelection() {

  if (selected.length === 0) {

    if (
      window.Telegram &&
      Telegram.WebApp
    ) {

      Telegram.WebApp.showPopup({

        title: "Мой выбор",

        message:
          "Сначала выберите хотя бы одно блюдо.",

        buttons: [
          {
            type: "ok"
          }
        ]

      });

    } else {

      alert(
        "Сначала выберите хотя бы одно блюдо."
      );

    }

    return;

  }


  const tg =
    window.Telegram &&
    Telegram.WebApp
      ? Telegram.WebApp
      : null;


  const initData =
    tg
      ? tg.initData
      : "";


  try {

    const response = await fetch(

      "https://cookbook-notifications.wbrm7bt4hn.workers.dev",

      {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          initData: initData,

          dishes: selected

        })

      }

    );


    const result =
      await response.json();


    if (!result.ok) {

      throw new Error(
        result.error ||
        "Ошибка отправки"
      );

    }


    if (tg) {

      tg.showPopup({

        title: "Готово",

        message:
          "Ваш выбор отправлен.",

        buttons: [
          {
            type: "ok"
          }
        ]

      });

    } else {

      alert(
        "Ваш выбор отправлен."
      );

    }


  } catch (error) {

    console.error(error);


    if (tg) {

      tg.showPopup({

        title: "Ошибка",

        message:
          error.message,

        buttons: [
          {
            type: "ok"
          }
        ]

      });

    } else {

      alert(
        error.message
      );

    }

  }

}


/* НАЗАД */

function goBack() {

  const previous =
    history.pop();


  if (!previous) {

    showMenu();

    return;

  }


  if (
    previous.page === "menu"
  ) {

    showMenu();

    return;

  }


  if (
    previous.page === "category"
  ) {

    showCategory(
      previous.category
    );

    return;

  }


  showMenu();

}


/* ЗАЩИТА КАВЫЧЕК */

function escapeQuotes(text) {

  return text
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );

}


/* TELEGRAM */

if (
  window.Telegram &&
  Telegram.WebApp
) {

  Telegram.WebApp.ready();

  Telegram.WebApp.expand();

}


/* ЗАПУСК */

showCover();

</script>
