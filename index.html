 {id:'pancakes',title:'Блины',category:'Завтраки и выпечка',desc:'Тонкие домашние блины',time:'25 мин',photo:'https://raw.githubusercontent.com/Milya461/cookbook-app-2026/main/%D0%B1%D0%BB%D0%B8%D0%BD%D1%8B.jpeg',ingredients:['Яйца — 2 шт.','Молоко — 500 мл','Мука — 200 г','Сахар — 1–2 ст. л.','Соль — щепотка','Растительное масло — 2 ст. л.'],steps:[['Подготовьте смесь','Смешайте яйца, сахар и соль.','https://images.unsplash.com/photo-1556911220-bff31c812dba?auto=format&fit=crop&w=700&q=80'],['Замесите тесто','Влейте молоко, постепенно добавьте муку и размешайте до однородности.','https://images.unsplash.com/photo-1528712306091-ed0763094c98?auto=format&fit=crop&w=700&q=80'],['Выпекайте','Слегка смажьте сковороду маслом и обжаривайте тонкие блины с двух сторон.','https://images.unsplash.com/photo-1528207776546-365bb710ee93?auto=format&fit=crop&w=700&q=80'],['Подавайте','Подавайте тёплыми со сметаной, вареньем или любимой начинкой.','https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=700&q=80']]},
 {id:'bolognese',title:'Болоньезе',category:'Паста и макароны',desc:'Паста с насыщенным мясным соусом',time:'45 мин',photo:'https://raw.githubusercontent.com/Milya461/cookbook-app-2026/main/%D0%B1%D0%BE%D0%BB%D0%BE%D0%BD%D1%8C%D0%B5%D0%B7%D0%B5.jpeg',ingredients:['Паста — 300 г','Фарш — 400 г','Томатная пассата — 400 г','Лук — 1 шт.','Чеснок — 2 зубчика','Масло, соль и специи'],steps:[['Подготовьте овощи','Мелко нарежьте лук и чеснок. По желанию добавьте мелко натёртую морковь.','https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=700&q=80'],['Обжарьте фарш','На небольшом количестве масла обжарьте лук, добавьте фарш и готовьте до изменения цвета.','https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?auto=format&fit=crop&w=700&q=80'],['Потушите соус','Добавьте томаты, чеснок и специи. Томите на слабом огне 20–30 минут.','https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=700&q=80'],['Смешайте с пастой','Отварите пасту по инструкции и подайте с мясным соусом.','https://images.unsplash.com/photo-1555949258-eb67b1ef0ceb?auto=format&fit=crop&w=700&q=80']]},
 {id:'lasagna',title:'Лазанья',category:'Паста и макароны',desc:'Слои пасты, мясного соуса и сыра',time:'1 ч 20 мин',photo:'https://raw.githubusercontent.com/Milya461/cookbook-app-2026/main/%D0%BB%D0%B0%D0%B7%D0%B0%D0%BD%D1%8C%D1%8F.jpeg',ingredients:['Листы для лазаньи — 9–12 шт.','Фарш — 500 г','Томатный соус — 400 г','Молоко — 500 мл','Сливочное масло — 40 г','Мука — 40 г','Тёртый сыр — 150–200 г'],steps:[['Приготовьте мясной соус','Обжарьте фарш с луком, добавьте томатный соус и потушите.','https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?auto=format&fit=crop&w=700&q=80'],['Сделайте белый соус','Растопите масло, вмешайте муку, постепенно влейте молоко и помешивайте до загустения.','https://images.unsplash.com/photo-1556911220-bff31c812dba?auto=format&fit=crop&w=700&q=80'],['Соберите слои','Выложите соусы и листы пасты слоями, сверху распределите сыр.','https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=700&q=80'],['Запеките','Запекайте при 180 °C около 35–45 минут до золотистой корочки. Дайте постоять 10 минут.','https://images.unsplash.com/photo-1574894709920-11b28e7367e3?auto=format&fit=crop&w=700&q=80']]}

function migrateLegacyRecipes(){try{const old=JSON.parse(localStorage.getItem('cookbookCustomRecipesV1')||'[]');if(!Array.isArray(old))return;const ids={'блины':'pancakes','блинчики':'pancakes','болоньезе':'bolognese','лазанья':'lasagna'};old.forEach(item=>{if(!item||!item.title)return;const id=ids[String(item.title).trim().toLocaleLowerCase('ru-RU')];if(!id)return;const target=recipeData.find(r=>r.id===id);if(!target)return;if(Array.isArray(item.ingredients)&&item.ingredients.length)target.ingredients=item.ingredients.slice();if(Array.isArray(item.steps)&&item.steps.length){const labels=['Подготовьте ингредиенты','Приготовьте основу','Доведите до готовности','Подавайте'];target.steps=item.steps.slice(0,4).map((step,i)=>Array.isArray(step)?step:[labels[i]||('Шаг '+(i+1)),String(step),target.steps[i]?target.steps[i][2]:'']);}if(item.image)target.photo=item.image;if(item.prepTime)target.time=String(item.prepTime);});}catch(_){}}

function load(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||'null');return Array.isArray(v)?v:fallback}catch(_){return fallback}}
function save(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(_){alert('Не удалось сохранить данные в этом браузере. Освободите место и попробуйте ещё раз.')}}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysUntil(date){if(!date)return null;return Math.ceil((new Date(date+'T23:59:59').getTime()-new Date(todayISO()+'T00:00:00').getTime())/86400000)}
function expiryPill(date){const n=daysUntil(date);if(n===null)return '';if(n<0)return '<span class="pill expired">Срок прошёл</span>';if(n<=3)return '<span class="pill soon">'+(n===0?'Сегодня':n===1?'Завтра':'Через '+n+' дн.')+'</span>';return '<span class="pill">До '+formatDate(date)+'</span>'}
function formatDate(date){if(!date)return '';const p=date.split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:date}

>${recipeData.map((r,i)=>recipeCard(r,i)).join('')}</div><div class="split-band"><div class="soft-card"><span class="decor">🥬</span><h3>Загляни в холодильник</h3><p>Учитывай сроки годности и сначала используй то, что может испортиться.</p><button class="outline" onclick="go('inventory')">ПРОВЕРИТЬ ЗАПАСЫ →</button></div><div class="soft-card dark"><span class="decor">🛒</span><h3>Список покупок</h3><p>Собери всё нужное в одном месте и отмечай покупки по мере готовности.</p><button class="primary" onclick="go('shopping')">ОТКРЫТЬ СПИСОК →</button></div></div>${expiring.length?`<div class="section-head"><div><h2>Пора использовать</h2><p>Проверь продукты с ближайшим сроком годности</p></div><button class="text-link" onclick="go('inventory')">Все продукты ↗</button></div><div class="product-list">${expiring.slice(0,3).map(productRow).join('')}</div>`:''}</section>`}

function recipeView(){const r=recipeData.find(x=>x.id===window.currentRecipeId)||recipeData[0];return `<section class="view"><div class="back-row"><button class="back" onclick="go('favorites')">← Мои рецепты</button><button class="outline" onclick="toggleFavorite('${r.id}');render()">${favorites.includes(r.id)?'♥ В сохранённых':'♡ Сохранить'}</button></div><div class="detail-layout"><div><div class="detail-photo" style="background-image:url('${esc(r.photo)}')"></div></div><div><p class="eyebrow">${esc(r.category)}</p><h1 class="page-title">${esc(r.title)}</h1><p class="subhead">${esc(r.desc)}</p><div class="recipe-meta" style="margin:13px 0 17px"><span>◷ ${esc(r.time)}</span><span>♧ ${r.ingredients.length} ингредиентов</span></div><div class="ingredient-panel"><h3>Ингредиенты</h3><div class="ingredient-list">${r.ingredients.map((item,i)=>`<label class="ingredient"><input type="checkbox" data-ingredient="${i}"> <span>${esc(item)}</span></label>`).join('')}</div><button class="outline full" style="margin-top:15px" onclick="addMissingIngredients('${r.id}')">ДОБАВИТЬ В ПОКУПКИ</button></div></div></div><div class="section-head"><div><h2>Готовить легко</h2><p>Пошагово, в формате карточек</p></div></div><div class="step-grid">${r.steps.map((s,i)=>`<article class="step-card"><div class="step-photo" style="background-image:url('${esc(s[2])}')"><span class="step-num">${String(i+1).padStart(2,'0')}</span></div><h4>${esc(s[0])}</h4><p>${esc(s[1])}</p></article>`).join('')}</div></section>`}
function openRecipe(id){window.currentRecipeId=id;go('recipe')}
function favoritesView(){return `<section class="view"><p class="eyebrow">Сохранили для тебя</p><h1 class="page-title">Мои рецепты</h1><p class="subhead">Оставили только три рецепта: блины, болоньезе и лазанью. Остальное можно искать в интернете по желанию.</p><div class="section-head"><div><h2>Любимые блюда</h2><p>Три рецепта, которые остаются в приложении</p></div></div><div class="recipe-grid">${recipeData.filter(r=>favorites.includes(r.id)).map((r,i)=>recipeCard(r,i)).join('')}</div>${favorites.length===0?'<div class="empty-state"><div class="big">♡</div><strong>Пока нет сохранённых рецептов</strong><p>Открой нужное блюдо и нажми на сердечко.</p></div>':''}<div class="form-card"><h3>Хочешь что-то новое?</h3><p class="subhead" style="margin-bottom:15px">Введи любое блюдо или набор продуктов — откроем поиск с рецептами в интернете.</p><form class="quick-search" onsubmit="submitRecipeSearch(event)"><input class="input" id="favoritesQuery" placeholder="Что приготовить сегодня?"><button class="primary">НАЙТИ ↗</button></form></div></section>`}
function addProduct(event){event.preventDefault();const id=document.getElementById('productId').value;const name=document.getElementById('productName').value.trim();if(!name)return;const obj={id:id||String(Date.now()),name,emoji:document.getElementById('productEmoji').value,quantity:document.getElementById('productQuantity').value.trim(),unit:document.getElementById('productUnit').value,place:document.getElementById('productPlace').value,expiry:document.getElementById('productExpiry').value};if(id)products=products.map(p=>p.id===id?obj:p);else products.push(obj);save(KEYS.products,products);productFilter='all';render()}
function resetProductForm(){const f=document.getElementById('productForm');if(f)f.reset();document.getElementById('productId').value='';document.getElementById('productFormTitle').textContent='＋ Добавить продукт';document.getElementById('productSubmit').textContent='СОХРАНИТЬ ПРОДУКТ'}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;document.getElementById('productId').value=p.id;document.getElementById('productName').value=p.name;document.getElementById('productEmoji').value=p.emoji||'🥬';document.getElementById('productQuantity').value=p.quantity||'';document.getElementById('productUnit').value=p.unit||'г';document.getElementById('productPlace').value=p.place||'fridge';document.getElementById('productExpiry').value=p.expiry||'';document.getElementById('productFormTitle').textContent='✎ Изменить продукт';document.getElementById('productSubmit').textContent='СОХРАНИТЬ ИЗМЕНЕНИЯ';document.getElementById('productForm').scrollIntoView({behavior:'smooth',block:'center'})}
function deleteProduct(id){const p=products.find(x=>x.id===id);if(!p||!confirm('Убрать «'+p.name+'» из запасов?'))return;products=products.filter(x=>x.id!==id);save(KEYS.products,products);render()}
function setProductFilter(v){productFilter=v;render()}
function addToShopping(name){const exists=shopping.some(x=>!x.checked&&x.name.toLowerCase()===name.toLowerCase());if(!exists){shopping.push({id:String(Date.now()+Math.random()),name,checked:false});save(KEYS.shopping,shopping)}updateNav()}
function addMissingIngredients(id){const r=recipeData.find(x=>x.id===id);if(!r)return;let count=0;const norm=s=>String(s||'').toLocaleLowerCase('ru-RU').replace(/ё/g,'е').replace(/[^\p{L}\p{N}]+/gu,' ').trim();r.ingredients.forEach(item=>{const name=item.split(' — ')[0].trim(),n=norm(name);const alreadyAtHome=products.some(p=>{const pn=norm(p.name);return pn===n||pn.includes(n)||n.includes(pn)});const alreadyListed=shopping.some(x=>!x.checked&&norm(x.name)===n);if(!alreadyAtHome&&!alreadyListed){shopping.push({id:String(Date.now()+Math.random()),name,checked:false});count++}});save(KEYS.shopping,shopping);alert('Добавлено в список покупок: '+count);}
function shoppingView(){const open=shopping.filter(x=>!x.checked),done=shopping.filter(x=>x.checked);return `<section class="view"><div class="back-row"><div><p class="eyebrow">Перед походом в магазин</p><h1 class="page-title">Список покупок</h1><p class="subhead">Отмечай продукты по мере покупки.</p></div><button class="outline" onclick="go('home')">← Главная</button></div><form class="quick-search" onsubmit="addShoppingItem(event)"><input id="shoppingInput" class="input" placeholder="Добавить продукт или товар" maxlength="100" required><button class="primary">＋ ДОБАВИТЬ</button></form><div class="section-head"><div><h2>Нужно купить</h2><p>${open.length} ${open.length===1?'позиция':open.length>=2&&open.length<=4?'позиции':'позиций'}</p></div><button class="text-link" onclick="addStockToShopping()">Добавить то, чего мало</button></div>${open.length?`<div class="shopping-list">${open.map(shoppingRow).join('')}</div>`:`<div class="empty-state"><div class="big">🛍️</div><strong>Список пока пуст</strong><p>Добавь сюда продукты, которые нужно купить. Можно также добавить ингредиенты из любимого рецепта.</p></div>`}${done.length?`<div class="section-head"><div><h2>Уже куплено</h2><p>${done.length} отмечено</p></div><button class="text-link" onclick="clearChecked()">Очистить купленное</button></div><div class="shopping-list">${done.map(shoppingRow).join('')}</div>`:''}</section>`}
function shoppingRow(item){return `<div class="shopping-row ${item.checked?'checked':''}"><input type="checkbox" ${item.checked?'checked':''} onchange="toggleShopping('${item.id}',this.checked)" aria-label="Отметить купленным"><span class="shopping-label">${esc(item.name)}</span><button class="tiny-button delete" onclick="deleteShopping('${item.id}')">×</button></div>`}
function addShoppingItem(event){event.preventDefault();const input=document.getElementById('shoppingInput');const name=input.value.trim();if(!name)return;if(!shopping.some(x=>!x.checked&&x.name.toLowerCase()===name.toLowerCase()))shopping.push({id:String(Date.now()+Math.random()),name,checked:false});save(KEYS.shopping,shopping);render()}
function toggleShopping(id,checked){shopping=shopping.map(x=>x.id===id?{...x,checked}:x);save(KEYS.shopping,shopping);render()}
function deleteShopping(id){shopping=shopping.filter(x=>x.id!==id);save(KEYS.shopping,shopping);render()}
function clearChecked(){shopping=shopping.filter(x=>!x.checked);save(KEYS.shopping,shopping);render()}
function addStockToShopping(){const suggestions=products.filter(p=>p.quantity&&(/^(0|0[.,]0+)$/.test(p.quantity)||/мало|заканч|нет/i.test(p.quantity)));if(!suggestions.length){alert('Нет продуктов с явно указанным маленьким остатком. Можно добавить нужное вручную.');return}suggestions.forEach(p=>addToShopping(p.name));render()}
function toggleFavorite(id){if(favorites.includes(id))favorites=favorites.filter(x=>x!==id);else favorites.push(id);save(KEYS.favorites,favorites);render()}
render();
</script>
</body>
</html>
