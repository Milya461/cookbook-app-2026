function renderDetail(){var r=recipes.find(function(x){return x.id===currentRecipe})||recipes[0];return'<section class="view"><div class="detail-top"><button class="back" onclick="go(\\'recipes\\')">← Все рецепты</button><span class="recipe-tag">'+esc(r.category)+'</span></div><section class="detail-hero"><div class="detail-photo"><img src="'+esc(r.photo)+'" alt="'+esc(r.title)+'"></div><div class="detail-copy"><p class="eyebrow">Любимый рецепт</p><h1>'+esc(r.title)+'</h1><p>'+esc(r.desc)+'</p><div class="detail-stats"><span>◷ '+esc(r.time)+'</span><span>♧ '+esc(r.servings)+'</span></div><button class="button light" onclick="go(\\'products\\')">Проверить продукты дома →</button></div></section><div class="detail-layout"><section class="ingredient-panel"><h2>Ингредиенты</h2><p class="note" style="margin-bottom:13px">Отмечай продукты по мере подготовки.</p><div class="ingredient-list">'+r.ingredients.map(function(x,i){var key=r.id+"-"+i;return'<label class="ingredient-line '+(checked[key]?"checked":"")+'"><input type="checkbox" '+(checked[key]?"checked":"")+' onchange="checkIngredient(\\''+key+'\\',this.checked)"><span>'+esc(x)+'</span></label>'}).join("")+'</div><div class="missing-box"><strong>Не хватает ингредиентов?</strong><p>Добавь продукты из рецепта в список покупок.</p><button class="button small full" onclick="addRecipeToShopping(\\''+r.id+'\\')">Добавить в покупки →</button></div></section><section><div class="section-head" style="margin-top:0"><div><h2>Готовить легко</h2><p>Пошаговый рецепт в карточках, как на твоём примере.</p></div></div><div class="detail-steps">'+r.steps.map(function(s,i){return'<article class="step-card"><div class="step-photo"><img src="'+esc(s[2]||r.photo)+'" alt="" loading="lazy"><span class="step-number">'+String(i+1).padStart(2,"0")+'</span></div><div class="step-copy"><h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p></div></article>'}).join("")+'</div></section></div></section>'}
function checkIngredient(key,on){checked[key]=on;var line=document.querySelector('[onchange="checkIngredient(\\''+key+'\\',this.checked)"]');if(line&&line.parentElement)line.parentElement.classList.toggle("checked",on)}
function addRecipeToShopping(id){var r=recipes.find(function(x){return x.id===id});if(!r)return;var n=0;r.ingredients.forEach(function(ingredient){var name=ingredient.split(" — ")[0].trim();if(!shopping.some(function(x){return!x.done&&x.name.toLowerCase()===name.toLowerCase()})){shopping.push({id:uid(),name:name,amount:ingredient.indexOf(" — ")>=0?ingredient.split(" — ").slice(1).join(" — "):"",done:false,source:r.title});n++}});store(KEYS.shopping,shopping);alert(n?"Добавлено ингредиентов: "+n:"Все ингредиенты уже есть в списке покупок.");go("shopping")}
function renderShopping(){var open=shopping.filter(function(x){return!x.done}),done=shopping.filter(function(x){return x.done});return'<section class="view"><div class="page-head"><div><h1 class="page-title">Список покупок</h1><p class="subhead">Добавляй нужные продукты, отмечай купленное — и ничего не забудешь в магазине.</p></div></div><div class="shopping-layout"><form class="form-card" onsubmit="addShopping(event)"><h2 class="form-title">＋ Добавить в список</h2><div class="field" style="margin-bottom:12px"><label for="shopName">Что купить?</label><input id="shopName" maxlength="100" required placeholder="Например, сливки"></div><div class="field"><label for="shopAmount">Количество или заметка</label><input id="shopAmount" maxlength="70" placeholder="Например, 200 мл"></div><button class="button full" style="margin-top:14px">Добавить →</button><p class="note" style="margin-top:12px">Можно перенести ингредиенты из любого сохранённого рецепта.</p></form><section><div class="section-head" style="margin-top:0"><div><h2>Нужно купить</h2><p>'+open.length+' позиций осталось</p></div></div>'+(open.length?'<div class="shopping-list">'+open.map(shoppingItem).join("")+'</div>':'<div class="empty"><div class="emoji">🛍️</div><h3>Список пока пуст</h3><p>Добавь продукты вручную или перенеси ингредиенты из любимого рецепта.</p><button class="button" onclick="go(\\'recipes\\')">Выбрать рецепт</button></div>')+(done.length?'<div class="section-head"><div><h2>Уже куплено</h2><p>'+done.length+' отмечено</p></div><button class="button small outline" onclick="clearDone()">Очистить</button></div><div class="shopping-list">'+done.map(shoppingItem).join("")+'</div>':"")+'</section></div></section>'}
function shoppingItem(x){return'<div class="shopping-item '+(x.done?"done":"")+'"><input type="checkbox" '+(x.done?"checked":"")+' onchange="toggleShopping(\\''+x.id+'\\',this.checked)" aria-label="Отметить купленным"><div class="shopping-item-main"><strong>'+esc(x.name)+'</strong><small>'+esc(x.amount||"Количество не указано")+(x.source?" · для "+esc(x.source):"")+'</small></div><button class="delete-icon" onclick="deleteShopping(\\''+x.id+'\\')" aria-label="Удалить">×</button></div>'}
function addShopping(e){e.preventDefault();var name=document.getElementById("shopName").value.trim(),amount=document.getElementById("shopAmount").value.trim();if(!name)return;if(!shopping.some(function(x){return!x.done&&x.name.toLowerCase()===name.toLowerCase()}))shopping.push({id:uid(),name:name,amount:amount,done:false,source:""});store(KEYS.shopping,shopping);render()}
function toggleShopping(id,on){shopping=shopping.map(function(x){return x.id===id?Object.assign({},x,{done:on}):x});store(KEYS.shopping,shopping);render()}
function deleteShopping(id){shopping=shopping.filter(function(x){return x.id!==id});store(KEYS.shopping,shopping);render()}
function clearDone(){shopping=shopping.filter(function(x){return!x.done});store(KEYS.shopping,shopping);render()}
function render(){updateNav();var screen=document.getElementById("screen");if(view==="products")screen.innerHTML=renderProducts();else if(view==="recipes")screen.innerHTML=renderRecipes();else if(view==="shopping")screen.innerHTML=renderShopping();else if(view==="detail")screen.innerHTML=renderDetail();else screen.innerHTML=renderHome()}
render();
</script>
</body>
</html>
