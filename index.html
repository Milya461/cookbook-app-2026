<!DOCTYPE html>
<html lang="ru">
<head>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#21150f">

  <title>Моя кулинарная книга</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f3ed;
      color: #2d2926;
      font-family: Georgia, "Times New Roman", serif;
    }

    button {
      font: inherit;
    }

    #app {
      width: 100%;
      min-height: 100vh;
    }

    .screen {
      min-height: 100vh;
      padding: 24px 20px 40px;
    }

    .cover {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .cover h1 {
      font-size: 42px;
      line-height: 1.05;
      margin: 0 0 14px;
    }

    .cover p {
      font-size: 18px;
      margin: 0 0 35px;
    }

    .button {
      border: 0;
      border-radius: 30px;
      padding: 15px 28px;
      background: #2d2926;
      color: white;
      cursor: pointer;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 30px;
      margin: 0;
    }

    .back {
      border: 0;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
      padding: 8px 0;
    }

    .menu {
      display: grid;
      gap: 14px;
    }

    .menu button,
    .recipe-card {
      width: 100%;
      border: 0;
      border-radius: 18px;
      background: white;
      padding: 20px;
      text-align: left;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
      cursor: pointer;
    }

    .menu button {
      font-size: 20px;
    }

    .recipe-list {
      display: grid;
      gap: 14px;
    }

    .recipe-card h3 {
      margin: 0 0 7px;
      font-size: 20px;
    }

    .recipe-card p {
      margin: 0;
      color: #777;
      font-size: 14px;
    }

    .recipe {
      background: white;
      border-radius: 22px;
      overflow: hidden;
    }

    .recipe-photo {
      width: 100%;
      height: 260px;
      background: #ddd2c5;
      overflow: hidden;
    }

    .recipe-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .recipe-content {
      padding: 24px;
    }

    .recipe-content h1 {
      margin: 0 0 18px;
      font-size: 30px;
    }

    .recipe-content h2 {
      font-size: 20px;
      margin: 25px 0 10px;
    }

    .recipe-content ul,
    .recipe-content ol {
      padding-left: 22px;
      line-height: 1.7;
    }

    .favorite {
      width: 100%;
      margin-top: 25px;
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
    }

    .empty p {
      color: #777;
      margin-bottom: 25px;
    }

    .selected-list {
      display: grid;
      gap: 12px;
      margin-bottom: 25px;
    }

    .selected-item {
      background: white;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .remove {
      border: 0;
      background: transparent;
      color: #a33;
      cursor: pointer;
    }


    .add-form { display: grid; gap: 14px; }
    .form-card { background: #fff; border-radius: 18px; padding: 18px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
    .field { display: grid; gap: 7px; margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field label { font-size: 15px; font-weight: bold; }
    .field input, .field textarea { width: 100%; border: 1px solid #e5dcd2; border-radius: 12px; padding: 12px; background: #fffdf9; color: #2d2926; }
    .field textarea { min-height: 105px; resize: vertical; line-height: 1.5; }
    .field small, .form-note { color: #777; font-size: 13px; line-height: 1.45; }
    .form-actions { display: grid; gap: 10px; }
    .recipe-photo-placeholder { width: 100%; height: 100%; min-height: 180px; display: grid; place-items: center; color: #8b5e4a; font-size: 48px; }


    :root {
      --bg: #21150f;
      --paper: #f2e2ce;
      --cream: #f7ead8;
      --caramel: #bd8552;
      --caramel-light: #e3b77c;
      --coffee: #2a1a12;
      --muted: #c6b3a1;
      --line: rgba(236, 207, 172, .30);
      --accent: #bb8250;
      --soft: rgba(245, 224, 201, .12);
      --danger: #e9b4a7;
      --shadow: 0 20px 55px rgba(0, 0, 0, .22);
      --radius: 20px;
    }
    html { background: #21150f; }
    body {
      position: relative; isolation: isolate; min-height: 100vh; overflow-x: hidden;
      color: var(--cream); background: #21150f;
      font-family: "Palatino Linotype", "Book Antiqua", Georgia, serif;
    }
    body::before {
      content: ""; position: fixed; z-index: -2; inset: -24px;
      background-image: url("https://raw.githubusercontent.com/Milya461/cookbook-app-2026/main/%D0%B1%D0%BB%D0%B8%D0%BD%D1%8B.jpeg");
      background-size: cover; background-position: center;
      filter: blur(8px) brightness(.45) saturate(.72); transform: scale(1.04);
    }
    body::after {
      content: ""; position: fixed; z-index: -1; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 0%, rgba(183,117,60,.18), transparent 48%),
                  linear-gradient(135deg, rgba(22,13,9,.48), rgba(38,22,15,.74));
    }
    #app { min-height: 100vh; }
    .screen {
      width: min(100%, 760px); margin: 0 auto; min-height: 100vh;
      padding: 24px clamp(16px,4vw,30px) 46px; color: var(--cream);
      background: rgba(38,24,17,.53);
      border-left: 1px solid rgba(242,215,180,.36); border-right: 1px solid rgba(242,215,180,.36);
      box-shadow: 0 0 60px rgba(0,0,0,.10);
      backdrop-filter: blur(11px); -webkit-backdrop-filter: blur(11px);
    }
    .cover {
      position: relative; display: flex; flex-direction: column; justify-content: space-between;
      align-items: stretch; min-height: 100svh; padding: clamp(18px,4vw,30px); text-align: center;
      border: 0;
      background: linear-gradient(180deg, rgba(24,13,8,.46) 0%, rgba(35,20,12,.30) 43%, rgba(22,12,8,.78) 100%),
                  url("https://raw.githubusercontent.com/Milya461/cookbook-app-2026/main/%D0%B1%D0%BB%D0%B8%D0%BD%D1%8B.jpeg") center / cover;
      box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    .cover::before {
      content: ""; position: absolute; inset: 10px; border: 1px solid rgba(245,224,197,.66); pointer-events: none;
    }
    .cover-topline, .cover-bottomline {
      z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      color: rgba(250,236,217,.88); font-family: Arial,sans-serif; font-size: 9px;
      line-height: 1.4; letter-spacing: .16em; text-transform: uppercase;
    }
    .cover-topline { padding: 8px 4px 15px; border-bottom: 1px solid rgba(245,224,197,.42); }
    .cover-bottomline { padding: 15px 4px 7px; border-top: 1px solid rgba(245,224,197,.42); }
    .cover-center { z-index: 1; margin: auto 0; padding: 60px 6px 68px; }
    .cover-kicker {
      margin: 0 0 20px; color: var(--caramel-light); font-family: Arial,sans-serif;
      font-size: 10px; letter-spacing: .25em; line-height: 1.6; text-transform: uppercase;
    }
    .cover h1 {
      max-width: 620px; margin: 0 auto; color: #fff3e1;
      font-size: clamp(40px,10vw,72px); font-weight: 400; line-height: .91;
      letter-spacing: -.045em; text-shadow: 0 3px 30px rgba(0,0,0,.38);
    }
    .cover h1 em { color: #e8c59a; font-weight: 400; }
    .cover p.cover-description {
      max-width: 330px; margin: 24px auto 30px; color: rgba(255,241,224,.88);
      font-size: 16px; line-height: 1.6;
    }
    .button {
      min-height: 48px; padding: 14px 22px; color: #fff4e5;
      background: linear-gradient(130deg,#bd8651,#88542f);
      border: 1px solid rgba(244,209,165,.50); border-radius: 999px;
      box-shadow: 0 8px 22px rgba(0,0,0,.18);
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }
    .button:hover { transform: translateY(-2px); filter: brightness(1.07); }
    .button:active { transform: translateY(0); }
    .button.secondary { color: #f9e9d6; background: rgba(255,242,222,.10); border: 1px solid var(--line); box-shadow: none; }
    .button.accent { background: linear-gradient(130deg,#c58e58,#8e592f); }
    .button.danger { background: rgba(125,45,37,.72); color: #fff0e9; }
    .button.full { width: 100%; }
    .cover .button {
      min-width: 210px; padding: 16px 24px; color: #2b1a10;
      background: linear-gradient(135deg,#e5bd89,#b77a46); border: 0;
      font-family: Arial,sans-serif; font-size: 12px; letter-spacing: .07em; text-transform: uppercase;
    }
    .header {
      align-items: center; gap: 14px; margin-bottom: 25px; padding-bottom: 18px;
      border-bottom: 1px solid rgba(234,204,168,.28);
    }
    .header-main { flex: 1; min-width: 0; }
    .header h1 {
      margin: 0; color: #fff0dc; font-size: clamp(27px,7vw,38px);
      font-weight: 400; line-height: 1.04; letter-spacing: -.025em;
    }
    .header p {
      margin: 7px 0 0; color: #c9b49d; font-family: Arial,sans-serif;
      font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
    }
    .back {
      padding: 10px 13px; color: #f5e1c8; background: rgba(28,16,10,.58);
      border: 1px solid rgba(234,204,168,.34); border-radius: 999px;
      font-family: Arial,sans-serif; font-size: 12px;
    }
    .icon-button { color: #f5e1c8; background: rgba(28,16,10,.58); border-color: rgba(234,204,168,.34); }
    .menu { gap: 12px; }
    .menu button {
      color: #fff0dc; background: rgba(28,17,12,.72);
      border: 1px solid rgba(231,197,157,.33); border-radius: 17px;
      box-shadow: 0 8px 25px rgba(0,0,0,.12);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .menu button.category-card {
      display: grid; grid-template-columns: 108px minmax(0,1fr) 22px;
      gap: 14px; align-items: center; min-height: 112px; padding: 10px; overflow: hidden;
    }
    .category-card-photo {
      width: 108px; height: 100px; overflow: hidden;
      background: rgba(231,197,157,.14); border-radius: 11px;
    }
    .category-card-photo img {
      display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .3s ease;
    }
    .category-card:hover .category-card-photo img { transform: scale(1.05); }
    .category-card-copy { display: flex; min-width: 0; flex-direction: column; align-items: flex-start; gap: 6px; }
    .category-card-copy small {
      color: #d5aa77; font-family: Arial,sans-serif; font-size: 8px;
      letter-spacing: .17em; text-transform: uppercase;
    }
    .category-card-copy strong { color: #fff0dc; font-size: clamp(17px,4vw,22px); font-weight: 400; line-height: 1.1; }
    .category-card-copy em { color: #c5af98; font-family: Arial,sans-serif; font-size: 10px; font-style: normal; }
    .category-card-arrow { color: #d2a26f; font-size: 20px; align-self: start; padding-top: 4px; }
    .menu button.utility-card { display: flex; justify-content: space-between; align-items: center; min-height: 64px; padding: 17px 19px; font-size: 16px; }
    .recipe-list { gap: 13px; }
    .recipe-card.editorial-recipe-card {
      display: grid; grid-template-columns: 112px minmax(0,1fr); align-items: stretch; gap: 15px;
      padding: 10px; min-height: 120px; color: #fff0dc; background: rgba(29,17,11,.77);
      border: 1px solid rgba(232,201,165,.30); border-radius: 17px; box-shadow: 0 8px 24px rgba(0,0,0,.13);
    }
    .recipe-card-photo { width: 112px; height: 112px; overflow: hidden; border-radius: 10px; background: rgba(231,197,157,.12); }
    .recipe-card-photo img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
    .editorial-recipe-card:hover .recipe-card-photo img { transform: scale(1.05); }
    .recipe-card-copy { display: flex; min-width: 0; flex-direction: column; justify-content: center; align-items: flex-start; gap: 7px; padding: 5px 6px 5px 0; }
    .recipe-card h3 { margin: 0; color: #fff0dc; font-size: 18px; font-weight: 400; line-height: 1.13; }
    .recipe-card p { margin: 0; color: #c8b39d; font-family: Arial,sans-serif; font-size: 11px; line-height: 1.45; }
    .recipe-card-category { color: #d9aa75; font-family: Arial,sans-serif; font-size: 8px; letter-spacing: .16em; text-transform: uppercase; }
    .recipe {
      color: #382419; background: rgba(249,237,221,.97);
      border: 1px solid rgba(255,247,235,.7); border-radius: 23px; box-shadow: var(--shadow);
    }
    .recipe-photo { height: auto; aspect-ratio: 16 / 10; background: #4b3322; }
    .recipe-photo img { object-fit: cover; }
    .recipe-photo-placeholder { color: #ad7746; background: linear-gradient(135deg,#e9d4ba,#c9a27a); }
    .recipe-content { padding: clamp(20px,5vw,30px); }
    .recipe-content h1 { margin: 0 0 10px; color: #3c2619; font-size: clamp(30px,8vw,42px); font-weight: 400; line-height: 1.02; }
    .recipe-content > p { margin: 0; color: #80634d; font-family: Arial,sans-serif; font-size: 13px; line-height: 1.55; }
    .recipe-content h2 { margin: 27px 0 12px; padding-bottom: 8px; color: #9a673b; border-bottom: 1px solid #dfc7ac; font-size: 18px; font-weight: 400; letter-spacing: .02em; }
    .recipe-content ul, .recipe-content ol { color: #503827; font-family: Arial,sans-serif; font-size: 14px; line-height: 1.75; }
    .recipe-content .button { font-family: Arial,sans-serif; font-size: 13px; }
    .form-card { color: #3c281d; background: rgba(249,237,221,.97); border: 1px solid rgba(255,247,235,.55); box-shadow: var(--shadow); }
    .field label { color: #523a29; }
    .field input, .field textarea { color: #39251a; background: #fffaf3; border-color: #ddc4a8; }
    .field input:focus, .field textarea:focus { border-color: #a97545; box-shadow: 0 0 0 3px rgba(169,117,69,.14); outline: none; }
    .field small, .form-note { color: #806b58; }
    .form-note { margin: 0; }
    .selected-list { gap: 10px; }
    .selected-item { color: #3c281d; background: rgba(249,237,221,.97); border: 1px solid rgba(255,247,235,.55); box-shadow: 0 8px 22px rgba(0,0,0,.12); }
    .selected-item strong { color: #3c281d; }
    .selected-item div { color: #8c7059 !important; font-family: Arial,sans-serif; }
    .remove { color: #a34e4e; }
    .empty { color: #f7ead8; background: rgba(28,17,12,.70); border: 1px dashed rgba(231,197,157,.42); border-radius: 20px; }
    .empty h2 { font-weight: 400; }
    .empty p { color: #c6b3a1; }
    .footer-note { color: rgba(231,215,194,.66); font-family: Arial,sans-serif; font-size: 10px; }
    @media (max-width: 460px) {
      .screen:not(.cover) { padding: 19px 13px 35px; }
      .menu button.category-card { grid-template-columns: 88px minmax(0,1fr) 16px; gap: 11px; min-height: 95px; padding: 8px; }
      .category-card-photo { width: 88px; height: 86px; }
      .category-card-copy strong { font-size: 17px; }
      .recipe-card.editorial-recipe-card { grid-template-columns: 94px minmax(0,1fr); gap: 11px; min-height: 101px; padding: 8px; }
      .recipe-card-photo { width: 94px; height: 94px; }
      .recipe-card h3 { font-size: 16px; }
      .recipe-card p { font-size: 10px; }
      .cover-topline, .cover-bottomline { font-size: 7px; letter-spacing: .12em; }
      .cover-center { padding: 42px 10px 50px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }


    /* Мобильная навигация */
    .screen.app-page { padding-bottom: calc(112px + env(safe-area-inset-bottom)); }
    .bottom-nav {
      position: fixed; z-index: 50; left: 50%; bottom: 0; transform: translateX(-50%);
      width: min(100%, 760px); display: grid; grid-template-columns: repeat(4, minmax(0,1fr));
      padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
      background: rgba(27,16,10,.96); border-top: 1px solid rgba(235,202,163,.26);
      box-shadow: 0 -12px 34px rgba(0,0,0,.24); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .bottom-nav button {
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
      min-height:48px; padding:4px 1px; border:0; border-radius:12px; color:#baa38d;
      background:transparent; font:10px Arial,sans-serif;
    }
    .bottom-nav button .nav-icon { font-size:21px; line-height:1.15; }
    .bottom-nav button.active { color:#f2c18a; background:rgba(196,137,79,.13); }
    .hero-panel {
      position:relative; min-height:180px; display:flex; flex-direction:column; justify-content:flex-end;
      margin:0 0 22px; padding:22px 20px; overflow:hidden; border-radius:20px;
      background:linear-gradient(90deg,rgba(22,12,7,.9),rgba(22,12,7,.28)),
        url("https://raw.githubusercontent.com/Milya461/cookbook-app-2026/main/%D0%BE%D0%BB%D0%B8%D0%B2%D1%8C%D0%B5.jpeg") center/cover;
      border:1px solid rgba(232,197,157,.3); box-shadow:0 12px 35px rgba(0,0,0,.17);
    }
    .hero-panel .eyebrow { color:#e1b37e; font:9px/1.4 Arial,sans-serif; letter-spacing:.22em; text-transform:uppercase; }
    .hero-panel h2 { margin:8px 0 7px; max-width:360px; color:#fff1df; font-size:clamp(28px,7vw,38px); line-height:.98; font-weight:400; }
    .hero-panel p { margin:0; max-width:310px; color:#e3d0bb; font:11px/1.5 Arial,sans-serif; }
    .quick-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:0 0 23px; }
    .quick-action {
      display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:54px; padding:13px 14px;
      text-align:left; color:#f2e1cd; background:rgba(255,240,221,.07);
      border:1px solid rgba(231,197,157,.25); border-radius:14px; font-size:13px;
    }
    .quick-action strong { color:#e5b37b; font-weight:400; font-size:17px; }
    .section-heading { display:flex; align-items:end; justify-content:space-between; gap:10px; margin:24px 0 12px; }
    .section-heading h2 { margin:0; color:#fff0dc; font-size:23px; font-weight:400; }
    .section-heading span { color:#c5aa8d; font:10px Arial,sans-serif; }
    .home-search, .search-input {
      display:flex; align-items:center; gap:10px; width:100%; min-height:48px; padding:0 15px;
      color:#f8e8d5; background:rgba(25,15,10,.72); border:1px solid rgba(232,201,165,.28);
      border-radius:14px; font:13px Arial,sans-serif;
    }
    .home-search { margin:0 0 18px; }
    .home-search span, .search-input span { color:#d3a06a; font-size:18px; }
    .search-input input {
      flex:1; min-width:0; border:0; outline:0; padding:14px 0; color:#fff0dc;
      background:transparent; font:14px Arial,sans-serif; box-shadow:none;
    }
    .search-input input::placeholder { color:#b69c83; }
    .search-clear { padding:3px 6px; border:0; color:#c7ae94; background:transparent; font-size:21px; }
    .search-meta { margin:13px 0; color:#c5ad95; font:11px Arial,sans-serif; }
    .recipe-grid { display:grid; gap:13px; }
    .recipe-tile { position:relative; min-width:0; }
    .recipe-card-open {
      display:grid; grid-template-columns:112px minmax(0,1fr); align-items:stretch; gap:15px;
      width:100%; min-height:120px; padding:10px 47px 10px 10px; text-align:left; color:#fff0dc;
      background:rgba(29,17,11,.77); border:1px solid rgba(232,201,165,.30); border-radius:17px;
      box-shadow:0 8px 24px rgba(0,0,0,.13);
    }
    .recipe-card-open .recipe-card-photo { width:112px; height:112px; }
    .card-favorite {
      position:absolute; right:11px; top:11px; z-index:2; width:34px; height:34px;
      border:1px solid rgba(235,205,170,.32); border-radius:50%; color:#d8b38d;
      background:rgba(25,15,10,.82); font-size:18px;
    }
    .card-favorite.is-favorite { color:#f1b9a5; }
    .recipe-stats { display:flex; flex-wrap:wrap; gap:8px; margin:15px 0 20px; }
    .recipe-stat { display:inline-flex; align-items:center; gap:6px; padding:8px 11px; color:#78553a; background:#f0dfca; border-radius:999px; font:11px Arial,sans-serif; }
    .ingredient-list { display:grid; gap:8px; margin:0; padding:0; list-style:none; }
    .ingredient-check {
      display:flex; align-items:flex-start; gap:11px; padding:10px 12px;
      color:#503827; background:rgba(255,255,255,.52); border:1px solid #ead7c1;
      border-radius:11px; font:14px/1.45 Arial,sans-serif;
    }

function compressRecipeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Не получилось прочитать изображение."));
    reader.onload = () => {
      const image = new Image();
      image.onerror = () => reject(new Error("Файл не удалось открыть как изображение."));
      image.onload = () => {
        const maxSide = 900;
        const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));
        canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
        try {
          resolve(canvas.toDataURL("image/jpeg", 0.72));
        } catch (error) {
          reject(error);
        }
      };
      image.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function saveCustomRecipe(event) {
  event.preventDefault();

  const title = document.getElementById("newRecipeTitle").value.trim();
  const category = document.getElementById("newRecipeCategory").value.trim();
  const description = document.getElementById("newRecipeDescription").value.trim();
  const ingredients = document.getElementById("newRecipeIngredients").value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
  const steps = document.getElementById("newRecipeSteps").value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
  const prepTime = document.getElementById("newRecipePrepTime").value.trim();
  const servings = document.getElementById("newRecipeServings").value.trim();
  const file = document.getElementById("newRecipeImageFile").files[0];
  let image = document.getElementById("newRecipeImageUrl").value.trim();

  if (!title || !category) {
    alert("Заполни название и категорию рецепта.");
    return;
  }
  if (Object.values(recipes).flat().some(recipe => recipe[0].toLowerCase() === title.toLowerCase())) {
    alert("Рецепт с таким названием уже есть. Укажи другое название.");
    return;
  }
  if (file) {
    try {
      image = await compressRecipeImage(file);
    } catch (error) {
      alert(error.message || "Не удалось обработать фотографию.");
      return;
    }
  }

  const recipe = {
    title: title,
    category: category,
    description: description || "Мой домашний рецепт",
    prepTime: prepTime,
    servings: servings,
    ingredients: ingredients,
    steps: steps,
    image: image
  };
  const updatedRecipes = userAddedRecipes.concat(recipe);

  try {
    localStorage.setItem(CUSTOM_RECIPES_KEY, JSON.stringify(updatedRecipes));
  } catch (error) {
    alert("Не удалось сохранить рецепт. Попробуй фото меньшего размера или добавь ссылку на фото.");
    return;
  }

  userAddedRecipes = updatedRecipes;
  if (!recipes[category]) recipes[category] = [];
  recipes[category].push([recipe.title, recipe.description]);
  if (image) recipeImages[recipe.title] = image;

  cookbookCurrentCategory = category;
  showCategory(category);
}

/* ОТПРАВИТЬ В TELEGRAM */

async function sendSelection() {

  if (selected.length === 0) {

    if (
      window.Telegram &&
      Telegram.WebApp
    ) {

      Telegram.WebApp.showPopup({

        title: "Мой выбор",

        message:
          "Сначала выберите хотя бы одно блюдо.",

        buttons: [
          {
            type: "ok"
          }
        ]

      });

    } else {

      alert(
        "Сначала выберите хотя бы одно блюдо."
      );

    }

    return;

  }


  const tg =
    window.Telegram &&
    Telegram.WebApp
      ? Telegram.WebApp
      : null;


  const initData =
    tg
      ? tg.initData
      : "";


  try {

    const response = await fetch(

      "https://cookbook-notifications.wbrm7bt4hn.workers.dev",

      {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          initData: initData,

          dishes: selected

        })

      }

    );


    const result =
      await response.json();


    if (!result.ok) {

      throw new Error(
        result.error ||
        "Ошибка отправки"
      );

    }


    if (tg) {

      tg.showPopup({

        title: "Готово",

        message:
          "Ваш выбор отправлен.",

        buttons: [
          {
            type: "ok"
          }
        ]

      });

    } else {

      alert(
        "Ваш выбор отправлен."
      );

    }


  } catch (error) {

    console.error(error);


    if (tg) {

      tg.showPopup({

        title: "Ошибка",

        message:
          error.message,

        buttons: [
          {
            type: "ok"
          }
        ]

      });

    } else {

      alert(
        error.message
      );

    }

  }

}


/* НАЗАД */

function goBack() {

  const previous =
    history.pop();


  if (!previous) {

    showMenu();

    return;

  }


  if (
    previous.page === "menu"
  ) {

    showMenu();

    return;

  }


  if (
    previous.page === "category"
  ) {

    showCategory(
      previous.category
    );

    return;

  }


  showMenu();

}

async function saveCustomRecipe(event) {
  event.preventDefault();
  const title = document.getElementById("newRecipeTitle").value.trim();
  const category = document.getElementById("newRecipeCategory").value.trim();
  const description = document.getElementById("newRecipeDescription").value.trim();
  const ingredients = document.getElementById("newRecipeIngredients").value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
  const steps = document.getElementById("newRecipeSteps").value.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
  const prepTime = document.getElementById("newRecipePrepTime").value.trim();
  const servings = document.getElementById("newRecipeServings").value.trim();
  const file = document.getElementById("newRecipeImageFile").files[0];
  let image = document.getElementById("newRecipeImageUrl").value.trim();

  if (!title || !category) {
    alert("Заполни название и категорию рецепта.");
    return;
  }
  if (Object.values(recipes).flat().some(recipe => recipe[0].toLowerCase() === title.toLowerCase())) {
    alert("Рецепт с таким названием уже есть. Укажи другое название.");
    return;
  }
  if (file) {
    try { image = await compressRecipeImage(file); }
    catch (error) {
      alert(error.message || "Не удалось обработать фотографию.");
      return;
    }
  }

  const recipe = {
    title: title,
    category: category,
    description: description || "Мой домашний рецепт",
    prepTime: prepTime,
    servings: servings,
    ingredients: ingredients,
    steps: steps,
    image: image
  };
  const updated = userAddedRecipes.concat(recipe);
  try {
    localStorage.setItem(CUSTOM_RECIPES_KEY, JSON.stringify(updated));
  } catch (error) {
    alert("Не удалось сохранить рецепт. Попробуй фото меньшего размера или добавь ссылку на фото.");
    return;
  }

  userAddedRecipes = updated;
  if (!recipes[category]) recipes[category] = [];
  recipes[category].push([recipe.title, recipe.description]);
  if (image) recipeImages[recipe.title] = image;
  showCategory(category);
}

function ingredientItemsHtml(name, ingredients) {
  const checked = cookbookCheckedIngredients[name] || [];
  return ingredients.map(function(item, index) {
    const marked = checked.includes(index);
    return '<li><label class="ingredient-check ' + (marked ? "checked" : "") + '">' +
      '<input type="checkbox" data-recipe="' + escapeHtml(name) + '" data-index="' + index + '" ' + (marked ? "checked" : "") +
      ' onchange="toggleIngredientCheck(this.dataset.recipe, Number(this.dataset.index), this.checked)"><span>' + escapeHtml(item) + '</span></label></li>';
  }).join("");
}
function showRecipe(category, index) {
  cookbookCurrentView = "recipe";
  cookbookCurrentCategory = category;
  cookbookCurrentRecipeIndex = index;
  const recipe = (recipes[category] || [])[index];
  if (!recipe) return showMenu();
  const name = recipe[0];
  const custom = userAddedRecipes.find(item => item.title === name && item.category === category);
  const photo = cookbookPhoto(name);
  const checkedSelected = selected.includes(name);
  const favorite = cookbookFavorites.has(name);
  const ingredients = custom && Array.isArray(custom.ingredients) ? custom.ingredients : [];
  const steps = custom && Array.isArray(custom.steps) ? custom.steps : [];
  const photoHtml = photo ? '<img src="' + escapeHtml(photo) + '" alt="' + escapeHtml(name) + '">' : '<div class="recipe-photo-placeholder">🍲</div>';
  const ingredientsHtml = ingredients.length
    ? '<ul class="ingredient-list" id="ingredientList">' + ingredientItemsHtml(name, ingredients) + '</ul>'
    : '<div class="recipe-note">Подробный список ингредиентов для этой записи пока не заполнен. В личном рецепте можно указать продукты и их количество — тогда их получится отмечать галочками во время готовки.</div>';
  const stepsHtml = steps.length
    ? '<ol class="recipe-steps">' + steps.map(item => '<li>' + escapeHtml(item) + '</li>').join("") + '</ol>'
    : '<div class="recipe-note">Подробные шаги приготовления для этой записи пока не добавлены.</div>';
  const stats = [
    custom && custom.prepTime ? '<span class="recipe-stat">◷ ' + escapeHtml(custom.prepTime) + '</span>' : '',
    custom && custom.servings ? '<span class="recipe-stat">♧ ' + escapeHtml(custom.servings) + ' порц.</span>' : '',
    '<span class="recipe-stat">♧ ' + escapeHtml(category) + '</span>'
  ].filter(Boolean).join("");

  document.getElementById("app").innerHTML = cookbookWrap(
    '<div class="header"><button class="back" onclick="goBack()">← Назад</button><div class="header-main"><p>' + escapeHtml(category) + '</p></div><button class="icon-button" data-name="' + escapeHtml(name) + '" onclick="toggleFavorite(this.dataset.name)" aria-label="Избранное">' + (favorite ? "♥" : "♡") + '</button></div>' +
    '<article class="recipe"><div class="recipe-photo">' + photoHtml + '</div><div class="recipe-content"><h1>' + escapeHtml(name) + '</h1><p>' + escapeHtml(recipe[1] || "Домашний рецепт") + '</p>' +
      (stats ? '<div class="recipe-stats">' + stats + '</div>' : '') +
      '<section class="recipe-section"><h2>Ингредиенты</h2>' + ingredientsHtml + '</section>' +
      '<section class="recipe-section"><h2>Приготовление</h2>' + stepsHtml + '</section>' +
      '<div class="recipe-actions"><button class="button full" data-name="' + escapeHtml(name) + '" onclick="toggleSelected(this.dataset.name)">' + (checkedSelected ? "✓ Убрать из моего выбора" : "＋ Добавить в мой выбор") + '</button>' +
      '<button class="button secondary full" data-name="' + escapeHtml(name) + '" onclick="toggleFavorite(this.dataset.name)">' + (favorite ? "♥ В избранном" : "♡ Добавить в избранное") + '</button></div>' +
    '</div></article>',
    "book"
  );
}
function toggleIngredientCheck(name, index, isChecked) {
  if (!Array.isArray(cookbookCheckedIngredients[name])) cookbookCheckedIngredients[name] = [];
  cookbookCheckedIngredients[name] = isChecked
    ? [...new Set(cookbookCheckedIngredients[name].concat(index))]
    : cookbookCheckedIngredients[name].filter(item => item !== index);
  saveCookbookCheckedIngredients();
  const root = document.getElementById("ingredientList");
  const custom = userAddedRecipes.find(item => item.title === name && item.category === cookbookCurrentCategory);
  if (root && custom && Array.isArray(custom.ingredients)) root.innerHTML = ingredientItemsHtml(name, custom.ingredients);
}

function toggleSelected(name) {
  if (selected.includes(name)) selected = selected.filter(item => item !== name);
  else selected.push(name);
  saveSelected();
  if (cookbookCurrentView === "recipe") showRecipe(cookbookCurrentCategory, cookbookCurrentRecipeIndex);
  else showSelected();
}
function openSelected() {
  cookbookHistory.push({ view: cookbookCurrentView, category: cookbookCurrentCategory, index: cookbookCurrentRecipeIndex, searchTerm: cookbookSearchTerm });
  showSelected();
}
function showSelected() {
  cookbookCurrentView = "selected";
  const chosen = [];
  Object.keys(recipes).forEach(function(category) {
    (recipes[category] || []).forEach(function(recipe, index) {
      if (selected.includes(recipe[0])) chosen.push({ category: category, recipe: recipe, index: index });
    });
  });
  const items = chosen.map(function(item) {
    return '<div class="selected-item"><div><strong>' + escapeHtml(item.recipe[0]) + '</strong><div style="font-size:11px;margin-top:5px">' + escapeHtml(item.category) + '</div></div>' +
      '<div style="display:flex;gap:8px;align-items:center"><button class="small-button" data-category="' + escapeHtml(item.category) + '" data-index="' + item.index + '" onclick="openRecipe(this.dataset.category, Number(this.dataset.index))">Открыть</button><button class="remove" data-name="' + escapeHtml(item.recipe[0]) + '" onclick="removeSelected(this.dataset.name)">Убрать</button></div></div>';
  }).join("");
  document.getElementById("app").innerHTML = cookbookWrap(
    '<div class="header"><div class="header-main"><p>Блюда, которые хочется приготовить</p><h1>Мой выбор</h1><div class="screen-title-count" style="margin-top:7px">' + cookbookCountLabel(chosen.length) + '</div></div></div>' +
    (chosen.length
      ? '<div class="selected-list">' + items + '</div><button class="button full" onclick="sendSelection()">Отправить мой выбор в Telegram&nbsp; ↗</button><p class="form-note" style="margin-top:12px">Отправим список выбранных блюд в твой бот.</p>'
      : '<div class="empty"><div class="empty-symbol">🍽️</div><h2>Пока ничего не выбрано</h2><p>Открывай рецепты и добавляй блюда кнопкой «В мой выбор».</p><button class="button" onclick="navigateTab(&quot;book&quot;)">Выбрать блюда</button></div>'),
    "book"
  );
}
function removeSelected(name) {
  selected = selected.filter(item => item !== name);
  saveSelected();
  showSelected();
}
function goBack() {
  const previous = cookbookHistory.pop();
  if (!previous) return showMenu();
  cookbookSearchTerm = previous.searchTerm || cookbookSearchTerm;
  cookbookCurrentCategory = previous.category || null;
  if (previous.view === "book" || previous.view === "menu") return showMenu();
  if (previous.view === "search") return showSearch();
  if (previous.view === "favorites") return showFavorites();
  if (previous.view === "selected") return showSelected();
  if (previous.view === "category") return showCategory(previous.category || cookbookCurrentCategory);
  if (previous.view === "recipe") return showRecipe(previous.category || cookbookCurrentCategory, previous.index || 0);
  return showMenu();
}


/* ЗАПУСК */

showCover();

</script>
